name: Release

# Separate from ci.yml on purpose: a tag push must not be blocked by, or
# entangled with, the test matrix. CI gates `main`; this gates the artifacts.
on:
  push:
    tags: ["v*"]

# Read-only by default; each job that writes to the release says so. A job
# added later starts with no write access unless it asks for it.
permissions:
  contents: read

jobs:
  # taiki-e/upload-rust-binary-action uploads *to an existing release*; pushing
  # a tag does not create one. Without this the builds all succeed and every
  # upload fails with "release not found", which is what happened on the first
  # attempt. Created as a draft so a failing smoke job can stop it going public.
  create-release:
    name: create draft release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing later in the job pushes or fetches with this token.
          persist-credentials: false
      - name: Create or reuse the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists, reusing it"
          else
            # Real notes, not a placeholder: this is what people read on the
            # release page. v0.11.5 shipped with the internal "artifacts are
            # uploaded by CI" string as its public description, which is how
            # that was noticed.
            #
            # They live in .github/release-notes.md rather than a heredoc here.
            # A YAML block scalar cannot contain a column-0 line, so a heredoc
            # terminator inside one is always indented and bash never matches
            # it. That broke the v0.12.0 tag, the first tag after the heredoc
            # was introduced. A tracked file is also reviewable in a diff.
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          fi

  build:
    needs: create-release
    name: build ${{ matrix.target }}
    strategy:
      # One target failing must not cancel the others: knowing three of four
      # built is more useful than knowing the run stopped.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # NO x86_64-apple-darwin. Not a CI limitation: ort-sys 2.0.0-rc.13
          # ships no prebuilt ONNX Runtime for that target, so the build fails
          # with "no prebuilt binaries available for target
          # x86_64-apple-darwin" wherever it runs. That means Intel Macs
          # cannot build videre at all today, including via `cargo install`.
          # Revisit when ort ships Intel macOS binaries; do not "fix" it by
          # adding a runner.
          #
          # (An earlier attempt used a macos-13 runner for this target. GitHub
          # is retiring that image, and asking for a dead label does not fail
          # fast: the job queued for 10 hours without running a step. Hence the
          # timeout below.)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # uploads the archives to the draft release
    # Belt and braces: no build should take anywhere near this. The default is
    # 6 hours, which is how a queued job burned a night.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing later in the job pushes or fetches with this token.
          persist-credentials: false

      - name: Add the target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # NOTE: aarch64-unknown-linux-gnu needs `-C target-feature=+fp16`, which
      # `.cargo/config.toml` sets for that target. Builds run from the repo
      # root and inherit it. Without it the build dies with 11x
      # `error: instruction requires: fullfp16` from gemm-f16 (a transitive
      # candle-core dependency). Do not "simplify" that config file away.
      #
      # NOTE: never replace this with `cargo check` on ARM64 Linux. `check`
      # passes even when `build` fails, because it skips codegen.
      # The build must come before the completion step: the scripts are
      # generated by the binary this job just built, so they cannot drift
      # from the flags this exact release ships.
      - name: Build the release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate shell completion scripts
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/videre"
          for shell in bash zsh fish; do
            "$bin" completion "$shell" > "videre.$shell"
          done

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: videre
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          include: videre.bash,videre.zsh,videre.fish
          token: ${{ secrets.GITHUB_TOKEN }}

      # Proof the artifact is self-contained. macOS was measured before this
      # workflow existed (system frameworks only, zero rpath, ONNX Runtime
      # statically linked). Linux was assumed, so print it and read it: a
      # versioned libonnxruntime.so, or any path inside the runner's
      # workspace, means the archive is not portable and the distribution
      # story changes.
      - name: Report dynamic dependencies
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/videre"
          [ -f "$bin" ] || bin="target/release/videre"
          echo "== $bin =="
          ls -lh "$bin"
          if command -v otool >/dev/null; then otool -L "$bin"; else ldd "$bin" || true; fi

  smoke:
    name: smoke ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # Write, although this job only downloads: the release is still a draft
    # here, and the API shows drafts only to a token with write access. With
    # read the download finds no release and the smoke test fails.
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      # Fixtures live in the repo (they are `exclude`d from the crate package,
      # not from git), so checkout gives the smoke test real JPEG/MOV/MP4 to
      # work on without downloading anything.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing later in the job pushes or fetches with this token.
          persist-credentials: false

      - name: Download the built artifact
        shell: bash
        run: |
          set -eux
          gh release download "$GITHUB_REF_NAME" \
            --pattern "videre-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" \
            --output videre.tar.gz
          tar xzf videre.tar.gz
          chmod +x videre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The point of this job: a binary that only runs where it was built is a
      # failure mode this project has hit three times in other forms. Exercise
      # the real thing on a runner that never compiled it.
      #
      # No model downloads, so it stays fast. The library is a temp directory
      # so the smoke test cannot touch the runner's real home or leave state in
      # the checked-out tree: the fixtures are copied into it, never scanned in
      # place.
      #
      # Asserts the exit code and a non-zero file count, not an exact count:
      # Linux skips HEIC and video frames, so counts legitimately differ by
      # platform.
      - name: Run it
        shell: bash
        run: |
          set -eux
          bin="$PWD/videre"
          library="$(mktemp -d)"
          cp crates/videre/tests/fixtures/*.jpg "$library/"
          "$bin" --version
          ( cd "$library" && "$bin" scan --silent )
          "$bin" --library "$library" stats
          n=$("$bin" --library "$library" stats --json | grep -oE '"total_files":[0-9]+' | grep -oE '[0-9]+')
          echo "scanned $n file(s)"
          test "$n" -gt 0
          test -f "$library/.videre/hashes.db"
          test ! -e crates/videre/tests/fixtures/.videre

  # The gate. Only a release whose artifacts have been downloaded onto a clean
  # runner and actually executed becomes visible. If smoke fails, the draft
  # stays a draft: the tag exists, the binaries exist, but nobody is offered a
  # download that was never run.
  publish:
    name: publish the release
    timeout-minutes: 10
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write # undrafts the release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing later in the job pushes or fetches with this token.
          persist-credentials: false
      - name: Undraft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # Regenerate the Homebrew formula so the tap can never lag the release. A tap
  # that lags does not fail: it silently installs an old version, which is
  # worse than not having one.
  #
  # Runs after publish, so the assets and their checksums definitely exist.
  # Needs TAP_TOKEN, a fine-grained PAT with contents:write on the tap repo:
  # the default GITHUB_TOKEN is scoped to this repository and cannot push
  # there. Fails loudly if the secret is missing or expired rather than
  # skipping, because a silently stale tap is exactly the failure being
  # prevented.
  tap:
    name: bump the homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Regenerate and push the formula
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_TOKEN is not set; the tap cannot be updated and would silently serve an old version." >&2
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          # Checksums come from the release's own .sha256 files, so the formula
          # can never disagree with what was actually published.
          #
          # --repo is required: this job deliberately does not check the
          # repository out, so gh has no git remote to infer from and fails
          # with "not a git repository". That is what broke the v0.12.0 tap.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sha256' --dir /tmp/sums
          sha() { awk '{print $1}' "/tmp/sums/videre-$tag-$1.sha256"; }
          mac_arm=$(sha aarch64-apple-darwin)
          lnx_x64=$(sha x86_64-unknown-linux-gnu)
          lnx_arm=$(sha aarch64-unknown-linux-gnu)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/aegea-dev/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          python3 - "$version" "$mac_arm" "$lnx_x64" "$lnx_arm" <<'PY'
          import re, sys, pathlib
          version, mac_arm, lnx_x64, lnx_arm = sys.argv[1:5]
          p = pathlib.Path("Formula/videre.rb")
          s = p.read_text()
          s = re.sub(r'version "[^"]+"', f'version "{version}"', s, count=1)
          # Order in the file is macOS arm, Linux x64, Linux arm.
          shas = [mac_arm, lnx_x64, lnx_arm]
          out, i = [], 0
          for line in s.split("\n"):
              if re.match(r'\s*sha256 "', line) and i < len(shas):
                  line = re.sub(r'"[^"]+"', f'"{shas[i]}"', line); i += 1
              out.append(line)
          assert i == 3, f"expected 3 sha256 lines, rewrote {i}"
          p.write_text("\n".join(out))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/videre.rb
          if git diff --cached --quiet; then
            echo "formula already current"
          else
            git commit -m "videre $version"
            git push
          fi
