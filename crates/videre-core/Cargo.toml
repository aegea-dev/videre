[package]
name = "videre-core"
version = "0.63.1"
edition = "2021"
description = "Shared SQLite, caching, and search helpers for the videre media library CLI"
license = "Apache-2.0"
repository = "https://github.com/erhangundogan/videre"
keywords = ["photos", "sqlite", "media", "videre"]
categories = ["multimedia::images"]

[dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
half = "=2.7.1"
image = { version = "=0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
indicatif = "=0.18.6"
reverse_geocoder = "=4.1.1"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
rustix = { version = "=1.1.4", features = ["fs"] }
toml = { version = "=1.1.6+spec-1.1.0", features = ["preserve_order"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
fs2 = "=0.4.3"
flate2 = "=1.1.9"
ctrlc = "=3.5.2"
chrono = "=0.4.45"
ureq = { version = "=3.4.0", features = ["json"] }
matrixmultiply = "=0.3.11"
tempfile = "=3.27.0"
tracing = "=0.1.44"

[dev-dependencies]
libc = "=0.2.189"
filetime = "=0.2.29"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "json", "registry"] }

[lints]
workspace = true
