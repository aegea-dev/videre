[package]
name = "videre-core"
version = "0.63.1"
edition = "2021"
description = "Shared SQLite, caching, and search helpers for the videre media library CLI"
license = "Apache-2.0"
repository = "https://github.com/erhangundogan/videre"
keywords = ["photos", "sqlite", "media", "videre"]
categories = ["multimedia::images"]

[dependencies]
anyhow = "1"
blake3 = "1"
half = "2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
indicatif = "0.18"
reverse_geocoder = "4"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
rustix = { version = "1.1.4", features = ["fs"] }
toml = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
flate2 = "1"
ctrlc = "3"
chrono = "0.4"
ureq = { version = "3", features = ["json"] }
matrixmultiply = "0.3"
tempfile = "3"
tracing = "0.1"

[dev-dependencies]
libc = "0.2"
filetime = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "registry"] }

[lints]
workspace = true
