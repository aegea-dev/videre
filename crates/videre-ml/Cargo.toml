[package]
name = "videre-ml"
version = "0.63.1"
edition = "2021"
description = "SigLIP embedding, zero-shot classification, and InsightFace face detection/clustering for the videre media library CLI"
license = "Apache-2.0"
repository = "https://github.com/erhangundogan/videre"
keywords = ["siglip", "arcface", "embeddings", "onnx", "videre"]
categories = ["multimedia::images", "science"]

[features]
real-model = []

[dependencies]
videre-core = { path = "../videre-core", version = "=0.63.1" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
image = { version = "=0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
half = "=2.7.1"
anyhow = "=1.0.104"
tracing = "=0.1.44"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokenizers = { version = "=0.20.4", default-features = false, features = ["onig", "esaxx_fast"] }
ndarray = "=0.17.2"
# Pinned exactly: a prerelease requirement accepts every later rc, and ort's
# rcs break their API (rc.14 changed Session::builder). `cargo install`
# ignores Cargo.lock, so an open requirement broke it for every published
# videre the day rc.14 came out. Move this pin deliberately.
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"] }
hf-hub = { version = "=1.0.0", features = ["blocking"] }
tempfile = "=3.27.0"

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
fs2 = "=0.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.11.0", features = ["metal"] }
candle-nn = { version = "=0.11.0", features = ["metal"] }
candle-transformers = { version = "=0.11.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"

[lints]
workspace = true
