[package]
name = "videre-ml"
version = "0.63.1"
edition = "2021"
description = "SigLIP embedding, zero-shot classification, and InsightFace face detection/clustering for the videre media library CLI"
license = "Apache-2.0"
repository = "https://github.com/erhangundogan/videre"
keywords = ["siglip", "arcface", "embeddings", "onnx", "videre"]
categories = ["multimedia::images", "science"]

[features]
real-model = []

[dependencies]
videre-core = { path = "../videre-core", version = "0.63.1" }
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
half = "2"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.20", default-features = false, features = ["onig", "esaxx_fast"] }
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
hf-hub = { version = "1.0.0-rc.1", features = ["blocking"] }
tempfile = "3"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"

[lints]
workspace = true
