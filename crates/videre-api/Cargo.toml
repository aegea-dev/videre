[package]
name = "videre-api"
version = "0.64.2"
edition = "2021"
description = "Transport-agnostic facade over videre's face-labeling and image-serving operations"
license = "Apache-2.0"
repository = "https://github.com/aegea-dev/videre"
keywords = ["faces", "labeling", "videre"]
categories = ["multimedia::images"]

[dependencies]
rusqlite = { version = "~0.40.2", features = ["bundled"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.151"
videre-core = { path = "../videre-core", version = "=0.64.2" }
image = { version = "~0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
anyhow = "~1.0.104"
tracing = "~0.1.44"

[dev-dependencies]
tempfile = "~3.27.0"
serde_json = "~1.0.151"
half = "~2.7.1"

[lints]
workspace = true
