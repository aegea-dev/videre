<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Cluster {{ cluster_id }}</title>
  <style>{{ chrome|safe }}</style>
  <style>{{ css|safe }}</style>
</head>
<body>
  {% include "nav.html" %}
  <div class="gallery-toolbar">
    <a href="{{ back_href }}">&larr; {{ back_label }}</a>
    <strong>Cluster {{ cluster_id }}</strong>
    <span id="face-count"></span>
    <span id="status"></span>
    <label class="view-toggle">Assign all to
      <input type="text" id="person-input" placeholder="Person name" maxlength="60" list="people-list">
    </label>
    <datalist id="people-list"></datalist>
    <button class="primary" onclick="assignAll()">Assign cluster</button>
    <button class="danger toolbar-end" onclick="dissolveCluster()">Dissolve cluster (wrong grouping)</button>
  </div>
  <main style="padding: 24px 32px">

    <div id="faces-grid" class="grid"></div>

    <div id="assignModal" class="modal-backdrop">
      <div class="modal">
        <h3>Assign to person</h3>
        <input id="assignInput" list="assign-people-list" placeholder="Person name" maxlength="60">
        <datalist id="assign-people-list"></datalist>
        <div class="modal-actions">
          <button onclick="submitAssignModal()">Assign</button>
          <button onclick="closeAssignModal()">Cancel</button>
        </div>
      </div>
    </div>
  </main>

  <script>window.CLUSTER_ID = {{ cluster_id }};</script>
  <script>let PEOPLE_ROOT="{{ back_href }}";</script>
  <script>{{ js|safe }}</script>
</body>
</html>
