<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Person</title>
  <style>{{ chrome|safe }}</style>
  <style>{{ css|safe }}</style>
</head>
<body>
  {% include "nav.html" %}
  <div class="gallery-toolbar">
    <a id="backLink" href="{{ back_href }}">&larr; {{ back_label }}</a>
    <strong id="person-title">Person</strong>
    <span id="face-count"></span>
    <span id="status"></span>
    <span id="renameArea" style="display:none">
      <input type="text" id="renameInput" maxlength="60">
      <button class="primary" onclick="submitRename()">Save</button>
    </span>
    <button id="removeBtn" class="danger toolbar-end" style="display:none" onclick="removePerson()">Remove person</button>
  </div>
  <main style="padding: 24px 32px">
    <div id="faces-grid" class="grid"></div>
  </main>

  <script>window.FACES_UI_ENABLED = {{ faces_ui_enabled }};</script>
  <script>let PEOPLE_ROOT="{{ back_href }}";</script>
  <script>{{ js|safe }}</script>
</body>
</html>
