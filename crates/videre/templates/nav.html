{# The section strip, shared by `gallery.html` and `faces.html`.

   :warning: It carries its own `<style>` on purpose. The two pages that include
   it have separate stylesheets (`gallery.css`, `faces.css`), so styling it there
   would mean two copies of the same rules kept in step by hand. A component
   included in two documents keeps its markup and its rules together, in one
   file, and adding a section later touches only this one.

   `nav` is `Option<Section>`, the current section, and `None` on any page that has
   nowhere to navigate to: a static `--html` export has no server, and the
   labeling-only server has no `/date` or `/`. Every route linked here exists
   only under `videre gallery`, which routes all three together.

   The gallery settings (`commands/gallery/settings.rs`) are emitted first and
   outside the nav condition, so every page that includes this file, a static
   export too, has them before its own scripts run. #}
{{ settings_script|safe }}<style>.settings-banner{padding:8px 16px;background:#7f1d1d;color:#fecaca;font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
{% if let Some(current) = nav %}<style>
.secnav{display:flex;align-items:center;gap:2px;padding:10px 16px;background:#1a1a1f;border-bottom:1px solid #2a2a33;position:sticky;top:0;z-index:50}
/* The brand link is excluded from these rules so it never gets the section
   buttons' hover/active highlight. */
.secnav a:not(.secnav-brand){padding:6px 14px;border-radius:6px;color:#9a9aa8;text-decoration:none;font:500 14px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.secnav a:not(.secnav-brand):hover{background:#25252d;color:#d8d8e0}
.secnav a.on{background:#3b82f6;color:#fff}
/* The videre wordmark (the docs-site logo) links home from the far left. It is
   never highlighted: no background on hover, no active state. */
.secnav-brand{display:flex;align-items:center;padding:2px 8px 2px 0;margin-right:4px;text-decoration:none}
.secnav-logo{display:block;height:20px;width:auto;color:#f4f4f5}
/* The spacer pushes the search box and the "..." menu to the far right. It is
   its own element, not the search box's auto margin, because the search box is
   hidden on a library with no embeddings and the menu must stay right. */
.secnav-spacer{flex:1}
/* The search box always submits to `/`, where the Files page reads `?q=` and
   runs a semantic search; from any other section it just navigates there
   first. */
.secnav-search{display:flex;position:relative}
/* The box holds the query's chips and, last, the input for words and the term
   being typed. 2px vertical padding plus the input's 3px keep it the height of
   the borderless section links, so the strip does not grow. */
.qbox{display:flex;align-items:center;gap:4px;min-width:200px;max-width:42vw;overflow-x:auto;padding:2px 6px;border:1px solid #2a2a33;border-radius:6px;background:#25252d;scrollbar-width:none}
.qbox:focus-within{outline:2px solid #3b82f6;outline-offset:1px}
.qbox input{flex:1;min-width:80px;padding:3px 4px;border:0;background:transparent;color:#d8d8e0;font:500 14px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;outline:none}
.qbox input::placeholder{color:#71717a}
.qbox input::-webkit-search-cancel-button{display:none}
.qbox-clear{flex:none;margin-left:auto;padding:0 4px;border:0;background:transparent;color:#9a9aa8;font:600 16px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
.qbox-clear:hover{color:#d8d8e0}
.qbox-clear[hidden]{display:none}
.toolbar-query .qbox-clear{color:#71717a}
.toolbar-query .qbox-clear:hover{color:#18181b}
.qchip{display:inline-flex;align-items:center;gap:2px;flex:none;max-width:260px;padding:1px 2px 1px 4px;border-radius:4px;background:#33333d;color:#d8d8e0;font:500 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:nowrap}
.qchip-neg{background:#4a2a2e}
.qchip-text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.qchip-body{overflow:hidden;text-overflow:ellipsis;cursor:text}
.qchip-key{color:#9a9aa8}
.qchip-key::after{content:":"}
.qchip-join{margin:0 3px;color:#9a9aa8}
.qchip button{padding:0 3px;border:0;border-radius:3px;background:transparent;color:#9a9aa8;font:inherit;cursor:pointer}
.qchip button:hover{background:#44444f;color:#f4f4f5}
.qchip-neg .qchip-not{color:#fca5a5}
.qchip-neg-word{margin-right:4px;color:#fca5a5}
.qbox-suggest{position:absolute;right:0;top:calc(100% + 4px);z-index:50;min-width:260px;max-width:420px;max-height:360px;overflow-y:auto;margin:0;padding:4px;list-style:none;background:#1f1f25;border:1px solid #2a2a33;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.qbox-suggest[hidden]{display:none}
.qbox-opt{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;color:#d8d8e0;font:500 13px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
.qbox-opt[aria-selected=true]{background:#2f3b52}
.qbox-face{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none}
.qbox-opt-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbox-opt-value{color:#71717a;font-size:12px}
.qbox-opt-count{color:#9a9aa8;font-size:12px;font-variant-numeric:tabular-nums}
/* The options panel: one column per kind of filter, under the box. */
.qbox-caret{margin-left:4px;padding:4px 8px;border:1px solid #2a2a33;border-radius:6px;background:#25252d;color:#9a9aa8;font:500 12px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
/* Its own hover: a page's `button:hover` outranks a class alone. */
.qbox-caret:hover,.qbox-caret[aria-expanded=true]{background:#2a2a33;color:#f4f4f5}
.qbox-caret[hidden]{display:none}
.qbox-options{position:absolute;right:0;top:calc(100% + 4px);z-index:60;width:min(920px,92vw);max-height:70vh;overflow:auto;padding:12px;background:#1f1f25;border:1px solid #2a2a33;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);color:#d8d8e0;font:500 13px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

/* Docked in a tab's toolbar (query-box.js), the box opens its lists from its
   left edge, where it sits, rather than from the nav's right end. */

.toolbar-query .qbox-caret{margin-left:6px;padding:4px 10px;background:#e9e9ed;color:#18181b;font-size:13px}
.toolbar-query .qbox-caret:hover,.toolbar-query .qbox-caret[aria-expanded=true]{background:#d4d4d8;color:#18181b}
.toolbar-query .qbox-suggest,.toolbar-query .qbox-options{left:0;right:auto}
/* Its suggestions and Filter panel are light too, hanging off a light bar:
   white like the field, the bar's border, and the bar's pressed blue for what
   is chosen. In the nav they stay dark. */
.toolbar-query .qbox-suggest,.toolbar-query .qbox-options{background:#fff;border-color:#2a2a33;color:#18181b;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toolbar-query .qbox-opt,.toolbar-query .qopt-val{color:#18181b}
.toolbar-query .qopt-val:hover{background:#f4f4f5}
.toolbar-query .qbox-opt[aria-selected=true],.toolbar-query .qopt-val[aria-pressed=true]{background:#2a6db5;color:#fff}
.toolbar-query :is(.qbox-opt[aria-selected=true],.qopt-val[aria-pressed=true]) :is(.qbox-opt-value,.qbox-opt-count){color:#dbeafe}
.toolbar-query .qbox-opt-value,.toolbar-query .qopt-sub,.toolbar-query .qopt-none{color:#71717a}

.qopt-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.qopt-col h3{margin:0 0 6px;font-size:12px;font-weight:600;color:#9a9aa8;text-transform:uppercase;letter-spacing:.04em}
.qopt-sub{margin:6px 0 2px;color:#71717a;font-size:11px}
.qopt-vals{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow-y:auto}
.qopt-val{display:flex;align-items:center;gap:6px;padding:3px 6px;border:0;border-radius:4px;background:transparent;color:#d8d8e0;font:inherit;text-align:left;cursor:pointer}
.qopt-val:hover{background:#2a2a33}
.qopt-val[aria-pressed=true]{background:#2f3b52;color:#f4f4f5}
.qopt-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qopt-none{color:#71717a;font-size:12px}
.qopt-date{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;color:#9a9aa8;font-size:12px}

.qopt-apply:hover{background:#2563eb;color:#fff}
/* The "..." menu sits after the search box at the far right. Its item reuses
   the section-link rule above for padding, colour and hover. */
.secnav-menu{position:relative;margin-left:8px}
.secnav-more{padding:4px 10px;border:0;border-radius:6px;background:transparent;color:#9a9aa8;font:600 18px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}

.secnav-processing-btn:hover{background:#25252d}

.secnav-processing-list[hidden]{display:none}

<script>
// The one empty state every page shows when it has nothing to show: a centred
// `.empty-state` box directly under the nav, with everything else on the page
// (toolbars, headers, layouts) hidden, so no route looks different from
// another when a library is empty. `body` is the box's inner HTML after the
// heading. Calling it again replaces the message.
// The heights of the sticky chrome, for what sticks below it: --secnav-h, the
// nav's; --toolbar-bottom, the nav's plus the page's sticky toolbar, where the
// query's "N of M" line sticks; and --chrome-h, all three, for the People list.
// Measured, not written as constants: the toolbar wraps on a narrow window and
// grows with the query's chips, and the line appears only once a query runs.
(function(){
  var nav=document.querySelector('nav.secnav');
  function visibleHeight(el){ return el&&el.offsetParent!==null?el.offsetHeight:0; }
  function measure(){
    var root=document.documentElement.style;
    var navH=nav?nav.offsetHeight:0;
    var barH=visibleHeight(document.querySelector('.gallery-toolbar:not(.recluster-row)'));
    var statusH=visibleHeight(document.getElementById('query-status'));
    root.setProperty('--secnav-h',navH+'px');
    root.setProperty('--toolbar-bottom',(navH+barH)+'px');
    root.setProperty('--chrome-h',(navH+barH+statusH)+'px');
  }
  function watch(){
    measure();
    if(!('ResizeObserver' in window))return window.addEventListener('resize',measure);
    var ro=new ResizeObserver(measure);
    if(nav)ro.observe(nav);
    var bar=document.querySelector('.gallery-toolbar:not(.recluster-row)');
    if(bar)ro.observe(bar);
    // The status line is added by the page's script once its query has run.
    var status=document.getElementById('query-status');
    if(status){ ro.observe(status); return; }
    var mo=new MutationObserver(function(){
      var s=document.getElementById('query-status');
      if(s){ mo.disconnect(); ro.observe(s); measure(); }
    });
    mo.observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch);
  else watch();
})();
window.showEmptyState=function(title,body){
  if(window.videreUndockQuery)window.videreUndockQuery();
  var nav=document.querySelector('nav.secnav');
  var box=document.getElementById('page-empty');
  if(!box){
    box=document.createElement('div');
    box.id='page-empty';
    box.className='empty-state';
    nav.parentNode.insertBefore(box,nav.nextSibling);
  }
  box.innerHTML='<h2>'+title+'</h2>'+body;
  Array.prototype.forEach.call(document.body.children,function(el){
    if(el!==nav&&el!==box&&el.tagName!=='SCRIPT'&&el.tagName!=='STYLE')el.style.display='none';
  });
};
{% include "query-box.js" %}
// The nav's "..." menu: page-independent actions, Settings first. Closes on
// Escape (focus back to the button), an outside click, or choosing an item.
(function(){
  var btn=document.getElementById('secnav-more'),list=document.getElementById('secnav-menu-list');
  function set(open){
    list.hidden=!open;
    btn.setAttribute('aria-expanded',String(open));
    if(open){ var first=list.querySelector('[role=menuitem]'); if(first)first.focus(); }
  }
  btn.addEventListener('click',function(e){ e.stopPropagation(); set(list.hidden); });
  document.addEventListener('click',function(e){ if(!list.hidden&&!list.contains(e.target))set(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!list.hidden){ set(false); btn.focus(); } });
})();
// "n still processing": while videre watch has files it has not finished,
// polled every 10 seconds while the page is visible. The count is the largest
// stage's; the list says what each stage still has to do. Hidden at zero.
(function(){
  var box=document.getElementById('secnav-processing'),btn=document.getElementById('secnav-processing-btn'),list=document.getElementById('secnav-processing-list');
  var names={faces:'faces to detect',embed:'files to embed',classify:'files to classify',locations:'photos to place'};
  function render(d){
    var stages=(d&&d.watch&&d.stages)||[];
    if(!stages.length){ box.hidden=true; list.hidden=true; btn.setAttribute('aria-expanded','false'); return; }
    var n=Math.max.apply(null,stages.map(function(s){return s.outstanding;}));
    btn.textContent=n+' still processing';
    list.innerHTML=stages.map(function(s){
      return '<li>'+s.outstanding+' '+(names[s.stage]||s.stage)+'</li>';
    }).join('');
    box.hidden=false;
  }
  function poll(){
    if(document.visibilityState!=='visible')return;
    fetch('/api/processing').then(function(r){return r.ok?r.json():null;}).then(render).catch(function(){});
  }
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    list.hidden=!list.hidden;
    btn.setAttribute('aria-expanded',String(!list.hidden));
  });
  document.addEventListener('click',function(e){ if(!list.hidden&&!box.contains(e.target)){ list.hidden=true; btn.setAttribute('aria-expanded','false'); } });
  document.addEventListener('visibilitychange',poll);
  poll();
  setInterval(poll,10000);
})();
</script>
{% endif %}
