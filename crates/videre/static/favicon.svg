<svg viewBox="0 -66 432 432" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!--
    Square viewBox: the artwork is 432x300, so it is centred in a 432x432 box
    (y offset -66). A non-square favicon gets letterboxed or squashed by the
    browser, which is why the source dimensions are not used directly.

    Colour comes from CSS rather than the fill/stroke attributes, because a
    favicon has no page around it to inherit from and a single fixed colour is
    invisible against half of all browser themes: white disappears on a light
    tab, black on a dark one. CSS beats a presentation attribute, so the
    attributes below stay as a fallback for anything that ignores the style
    block. Matches the logo convention: black on light, white on dark.
  -->
  <style>
    circle, line { fill: #000; stroke: #000; }
    @media (prefers-color-scheme: dark) {
      circle, line { fill: #fff; stroke: #fff; }
    }
  </style>
  <circle cx="24" cy="96" r="23.5" fill="black" stroke="black"/>
  <circle cx="216" cy="24" r="23.5" fill="black" stroke="black"/>
  <circle cx="408" cy="96" r="23.5" fill="black" stroke="black"/>
  <circle cx="216" cy="268" r="31.5" fill="black" stroke="black"/>
  <line x1="64.9706" y1="142" x2="154.066" y2="231.095" stroke="black" stroke-width="24" stroke-linecap="round"/>
  <line x1="215" y1="205" x2="215" y2="79" stroke="black" stroke-width="24" stroke-linecap="round"/>
  <line x1="278" y1="231.095" x2="367.095" y2="142" stroke="black" stroke-width="24" stroke-linecap="round"/>
</svg>
