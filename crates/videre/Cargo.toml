[package]
name = "videre"
version = "0.63.0"
edition = "2021"
description = "Local-first media library CLI: duplicate detection, semantic search, face recognition, and EXIF date repair over a single SQLite database"
license = "Apache-2.0"
repository = "https://github.com/erhangundogan/videre"
homepage = "https://github.com/erhangundogan/videre"
readme = "../../README.md"
keywords = ["photos", "duplicates", "exif", "cli", "search"]
categories = ["command-line-utilities", "multimedia::images"]
# Test fixtures are ~2.2MB of sample media that nothing at build or run time
# needs; keeping them out of the published tarball keeps `cargo install` lean.
exclude = ["tests/fixtures/*"]

[lib]
name = "videre"
path = "src/lib.rs"

[[bin]]
name = "videre"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
libc = "0.2"
blake3 = "1"
rayon = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
kamadak-exif = "0.6"
roxmltree = "0.21"
filetime = "0.2"
trash = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
videre-core = { path = "../videre-core", version = "0.63.0" }
videre-ml = { path = "../videre-ml", version = "0.63.0" }
videre-api = { path = "../videre-api", version = "0.63.0" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
anyhow = "1"
toml = { version = "1", features = ["preserve_order"] }
rmcp = { version = "3", features = ["transport-io"] }
schemars = "1"
askama = "0.16"
notify = "8"
notify-debouncer-full = "0.7"
little_exif = "0.6.23"
crc32fast = "1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "registry"] }
tracing-logfmt = "0.3"
file-rotate = "0.8"
# Parses the Lucene-style query language (`query_lang`) into a syntax tree;
# no tantivy index. Only the binary crate queries, so it stays out of core.
tantivy-query-grammar = "0.26"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Cross-process lock serialising tests that download shared model weights;
# see tests/common/mod.rs. Same version videre-core uses.
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
# Encodes the feature fixture's deterministic f16 model vectors; same version
# videre-core uses. See tests/common/feature_fixture.rs.
half = "2"
videre-core = { path = "../videre-core", version = "0.63.0" }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
# NSFileManager's trash, for the path a trashed file lands at (removal.rs).
# The same versions the trash crate already pulls in.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "0.11"

[lints]
workspace = true
