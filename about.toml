# cargo-about: the third-party notices shipped with every release archive
# (`make licenses`, and the release workflow). Licenses are tried in this
# order when a crate offers a choice, so the common permissive ones win.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MIT-0",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# Only what is compiled into the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]
private = { ignore = true }
